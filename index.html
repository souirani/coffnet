<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#000;color:#fff;min-height:100vh;padding:40px 20px}
.container{max-width:900px;margin:0 auto;background:#0a0a0a;border-radius:16px;padding:40px;border:1px solid #1a1a1a}

/* HEADER */
.header{text-align:center;padding:0 0 32px;border-bottom:1px solid rgba(255,214,0,0.2)}
.logo{font-size:32px;font-weight:900;letter-spacing:2px;color:#FFD600;font-style:italic}
.logo span{color:#fff}
.logo-sub{font-size:11px;color:#888;letter-spacing:4px;margin-top:4px;font-weight:600}
.title{font-size:24px;font-weight:700;margin:28px 0 6px;color:#fff}
.month{font-size:13px;color:#FFD600;letter-spacing:6px;font-weight:600}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:28px 0 20px;font-size:12px;font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:8px;color:#aaa}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dayhead{font-size:10px;color:#666;text-align:center;padding:8px 0;letter-spacing:2px;font-weight:700}
.day{aspect-ratio:1;background:#161616;border:1px solid #222;border-radius:6px;padding:8px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;justify-content:space-between;min-height:70px}
.day:hover{border-color:#FFD600;background:#1a1a1a;transform:translateY(-2px)}
.day.empty{background:transparent;border:1px dashed #1a1a1a;cursor:default}
.day.empty:hover{border-color:#1a1a1a;background:transparent;transform:none}
.daynum{font-size:15px;font-weight:700;color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{width:7px;height:7px;border-radius:50%}
.tag.feed{background:#FFD600}
.tag.story{background:#888}
.tag.special{background:#ff4444}
.day.special{border-color:rgba(255,214,0,0.4)}

/* SUMMARY */
.summary{margin-top:32px;padding:24px;background:#161616;border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center}
.statnum{font-size:28px;font-weight:800;color:#FFD600}
.statlbl{font-size:10px;color:#888;letter-spacing:2px;margin-top:4px;font-weight:600}

/* MODAL */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.card{background:#0a0a0a;border:1px solid #FFD600;border-radius:12px;padding:32px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.close{position:absolute;top:16px;right:16px;background:none;border:1px solid #333;color:#fff;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.close:hover{border-color:#FFD600;color:#FFD600}
.cardhead{border-bottom:1px solid rgba(255,214,0,0.3);padding-bottom:16px;margin-bottom:20px}
.cardday{font-size:11px;color:#FFD600;letter-spacing:4px;margin-bottom:8px;font-weight:700}
.cardtitle{font-size:22px;font-weight:700;color:#fff;line-height:1.3}
.section{margin-bottom:20px}
.label{font-size:10px;color:#FFD600;letter-spacing:2px;margin-bottom:8px;font-weight:700}
.text{font-size:14px;color:#ccc;line-height:1.7;font-weight:400}
.quote{background:#161616;border-left:3px solid #FFD600;padding:12px 16px;margin:8px 0;font-size:14px;color:#fff;font-style:italic;border-radius:0 6px 6px 0;line-height:1.5}
.pill{display:inline-block;background:rgba(255,214,0,0.15);color:#FFD600;padding:4px 10px;border-radius:4px;font-size:10px;letter-spacing:1px;margin-right:6px;margin-bottom:6px;font-weight:700}
.pill.story{background:rgba(136,136,136,0.2);color:#aaa}
.divider{border-top:1px solid #222;padding-top:18px;margin-top:18px}

@media(max-width:600px){
  body{padding:20px 10px}
  .container{padding:20px}
  .day{min-height:55px;padding:5px}
  .daynum{font-size:12px}
  .summary{grid-template-columns:repeat(2,1fr)}
  .title{font-size:20px}
  .logo{font-size:26px}
}
</style>

document.querySelectorAll('.day:not(.empty)').forEach(el => {
  el.addEventListener('click', () => {
    const day = el.dataset.day;
    const d = data[day] || {date: day + "/05/2026", title: "Dia livre"};
    let html = '<button class="close" onclick="document.getElementById(\'modal\').classList.remove(\'open\')">×</button>';
    html += '<div class="cardhead"><div class="cardday">'+d.date+'</div><div class="cardtitle">'+(d.title||"Dia livre — sem conteúdo programado")+'</div></div>';

    if(d.feed && d.feed.length){
      d.feed.forEach(f => {
        html += '<div class="section">';
        html += '<span class="pill">FEED</span><span class="pill">'+f.type+'</span><span class="pill">'+f.pilar+'</span>';
        html += '<div class="label" style="margin-top:12px">TEXTO DA ARTE</div><div class="quote">'+f.arte+'</div>';
        html += '<div class="label">LEGENDA</div><div class="text">'+f.legenda+'</div>';
        html += '</div>';
      });
    }

    if(d.story){
      html += '<div class="section divider">';
      html += '<span class="pill story">STORY INFLUENCER</span><span class="pill story">'+d.story.influencer+'</span>';
      html += '<div class="label" style="margin-top:12px">NICHO</div><div class="text">'+d.story.nicho+'</div>';
      html += '<div class="label" style="margin-top:12px">OPÇÃO A · ROTINA</div><div class="text">'+d.story.rotina+'</div>';
      html += '<div class="label" style="margin-top:12px">OPÇÃO B · CARD</div><div class="quote">'+d.story.card+'</div>';
      html += '</div>';
    }

    if((!d.feed || !d.feed.length) && !d.story){
      html += '<div class="text" style="text-align:center;padding:24px">Nenhum conteúdo programado para esse dia.</div>';
    }

    document.getElementById('cardcontent').innerHTML = html;
    document.getElementById('modal').classList.add('open');
  });
});

document.getElementById('modal').addEventListener('click', (e) => {
  if(e.target.id === 'modal') e.currentTarget.classList.remove('open');
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') document.getElementById('modal').classList.remove('open');
});
</script>
